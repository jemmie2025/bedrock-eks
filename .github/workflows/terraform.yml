name: Bedrock Infrastructure CI/CD

on:
  pull_request:
    branches:
      - main
    paths:
      - "terraform/**"
      - "modules/**"
      - "k8s/**"
      - ".github/workflows/terraform.yml"

  push:
    branches:
      - main
    paths:
      - "terraform/**"
      - "modules/**"
      - "k8s/**"
      - ".github/workflows/terraform.yml"

  workflow_dispatch:
    inputs:
      deploy:
        description: "Provision AWS infrastructure and deploy the application to EKS"
        required: true
        default: false
        type: boolean

env:
  AWS_REGION: us-east-1
  TERRAFORM_VERSION: "1.5.0"

permissions:
  contents: read

concurrency:
  group: bedrock-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:

  # ============================================================
  # CONTINUOUS INTEGRATION
  # Validates Terraform without accessing or modifying AWS.
  # Runs automatically on pushes and pull requests.
  # ============================================================

  terraform-validation:
    name: Terraform Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Check Terraform Formatting
        working-directory: terraform
        run: terraform fmt -check -recursive

      - name: Initialize Terraform Without Remote Backend
        working-directory: terraform
        run: terraform init -backend=false -input=false

      - name: Validate Terraform Configuration
        working-directory: terraform
        run: terraform validate


  # ============================================================
  # TERRAFORM PLAN
  # Runs only when deployment is manually requested.
  # This prevents normal commits from provisioning AWS resources.
  # ============================================================

  terraform-plan:
    name: Terraform Deployment Plan
    needs: terraform-validation

    if: >
      github.event_name == 'workflow_dispatch' &&
      inputs.deploy == true

    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS Authentication
        run: aws sts get-caller-identity

      - name: Initialize Terraform
        working-directory: terraform
        run: terraform init -input=false

      - name: Generate Terraform Plan
        working-directory: terraform
        run: |
          terraform plan \
            -no-color \
            -input=false \
            -lock-timeout=5m \
            -out=tfplan

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: bedrock-terraform-plan
          path: terraform/tfplan
          retention-days: 1


  # ============================================================
  # TERRAFORM APPLY
  # Provisions AWS resources only after an intentional
  # manual deployment request.
  # ============================================================

  terraform-apply:
    name: Provision AWS Infrastructure
    needs: terraform-plan

    if: >
      github.event_name == 'workflow_dispatch' &&
      inputs.deploy == true

    runs-on: ubuntu-latest

    environment:
      name: production

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS Authentication
        run: aws sts get-caller-identity

      - name: Initialize Terraform
        working-directory: terraform
        run: terraform init -input=false

      - name: Generate Deployment Plan
        working-directory: terraform
        run: |
          terraform plan \
            -no-color \
            -input=false \
            -lock-timeout=5m \
            -out=tfplan

      - name: Apply Terraform Configuration
        working-directory: terraform
        run: |
          terraform apply \
            -auto-approve \
            -input=false \
            tfplan

      - name: Export Terraform Outputs
        working-directory: terraform
        run: terraform output -json > ../terraform-outputs.json

      - name: Upload Terraform Outputs
        uses: actions/upload-artifact@v4
        with:
          name: bedrock-terraform-outputs
          path: terraform-outputs.json


  # ============================================================
  # APPLICATION DEPLOYMENT
  # Deploys the Retail Store sample application only after
  # successful AWS infrastructure provisioning.
  # ============================================================

  deploy-application:
    name: Deploy Application to Amazon EKS
    needs: terraform-apply

    if: >
      github.event_name == 'workflow_dispatch' &&
      inputs.deploy == true

    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: "v1.28.0"

      - name: Configure Helm
        uses: azure/setup-helm@v4
        with:
          version: "v3.13.0"

      - name: Configure Amazon EKS Access
        run: |
          aws eks update-kubeconfig \
            --name project-bedrock-cluster \
            --region "${{ env.AWS_REGION }}"

      - name: Verify Kubernetes Connectivity
        run: kubectl get nodes

      - name: Add Retail Application Helm Repository
        run: |
          helm repo add retail-app \
            https://aws.github.io/retail-store-sample-app

          helm repo update

      - name: Deploy Retail Store Application
        run: |
          helm upgrade --install retail retail-app/retail-app \
            --namespace retail-app \
            --create-namespace \
            --values k8s/retail-app-values.yaml \
            --wait \
            --timeout 15m

      - name: Verify Application Deployment
        run: |
          kubectl get pods -n retail-app
          kubectl get services -n retail-app
          kubectl get ingress -n retail-app

      - name: Publish Application Endpoint
        shell: bash
        run: |
          APP_URL=$(kubectl get ingress \
            -n retail-app \
            -o jsonpath='{.items[0].status.loadBalancer.ingress[0].hostname}')

          if [ -n "$APP_URL" ]; then
            echo "APP_URL=http://$APP_URL" >> "$GITHUB_ENV"

            {
              echo "## Bedrock Deployment"
              echo ""
              echo "Application successfully deployed to Amazon EKS."
              echo ""
              echo "**Application URL:** http://$APP_URL"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Application deployed, but the external endpoint is not available yet."

            {
              echo "## Bedrock Deployment"
              echo ""
              echo "Application deployment completed."
              echo ""
              echo "The external load balancer endpoint is still being provisioned."
            } >> "$GITHUB_STEP_SUMMARY"
          fi